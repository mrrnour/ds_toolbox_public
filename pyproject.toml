[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dstoolbox"
version = "0.4.0"
description = "Data-science utilities: I/O (Azure/MSSQL/Synapse/Delta/PI), ML training/scoring, NLP/LLM tagging, RAG pipelines, Spark ETL, SPC, plotting."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Mohammadreza Nourzadeh" }]
keywords = ["data-science", "machine-learning", "azure", "spark", "rag"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]

# Base install keeps SDK-heavy deps out; use extras for platform-specific stacks.
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "scipy>=1.10",
    "scikit-learn>=1.2",
    "matplotlib>=3.6",
    "seaborn>=0.12",
    # Imported eagerly by ml_funcs/__init__ -> assumptions.py, so the package
    # cannot be imported without it. Not optional despite only one module
    # using it.
    "statsmodels>=0.14",
    "plotly>=5.13",
    "pyyaml>=6.0",
    "tqdm>=4.65",
]

[project.optional-dependencies]
azure = [
    "azure-core>=1.26",
    "azure-storage-blob>=12.16",
    "azure-identity>=1.13",
    "azure-keyvault-secrets>=4.7",
]
bayes = [
    "pymc>=5.10,<6",
    "arviz>=0.17,<1",
]
mssql = [
    "pyodbc>=4.0.39",
    "sqlalchemy>=2.0",
]
spark = [
    "pyspark>=3.4",
]
rag = [
    "docling>=1.0",
    "langchain>=0.1",
    "langchain-chroma>=0.1",
    "langchain-community>=0.0.30",
    "langchain-core>=0.1",
    "langchain-huggingface>=0.0.3",
    "langchain-milvus>=0.1",
    "beautifulsoup4>=4.12",
    "requests>=2.31",
]
webreader = [
    "beautifulsoup4>=4.12",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "markdownify>=0.11",
    "pypdf>=4.0",
    "requests-ntlm>=1.2",
    "tqdm>=4.65",
    "docling>=1.0",
]
# Optional stealth backend (only imported when --fetcher stealthy is passed).
webreader-stealth = [
    "dstoolbox[webreader]",
    "scrapling>=0.4",
    "curl_cffi",
    "patchright",
    "msgspec",
    "camoufox",
]
nlp = [
    "spacy>=3.5",
    "sentence-transformers>=2.2",
]
pi = [
    "requests>=2.31",
    "requests-ntlm>=1.2",
]
ml = [
    "xgboost>=1.7",
    "lightgbm>=3.3",
    "optuna>=3.3",
    "shap>=0.42",
    "hyperopt>=0.2.7",
    "researchpy>=0.3",
    "statsmodels>=0.14",  # also a base dependency; kept here for clarity
]
dev = [
    "pre-commit>=3.5",
    "ruff>=0.4",
    "mypy>=1.8",
    "types-PyYAML",
    "types-requests",
]
test = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-mock>=3.11",
    "requests>=2.31",  # test_data_sources exercises the PI OAuth POST path
]
docs = [
    "pdoc>=15",
    "dstoolbox[all]",
]
all = [
    "dstoolbox[azure,bayes,mssql,spark,rag,webreader,nlp,pi,ml]",
]


[tool.setuptools.packages.find]
include = ["dstoolbox*"]
exclude = ["tests*", "dstoolbox.web_reader.tests*"]

[tool.setuptools.package-data]
"dstoolbox" = ["config.yml", "sql_template.yml", "*.yml"]
"dstoolbox.web_reader" = ["project_webreader.yaml", ".env.example", "urls.txt"]

[project.scripts]
# web_reader CLIs — previously invoked as `python scraper.py` from inside the
# folder; now installable console entry points.
webreader-scrape = "dstoolbox.web_reader.scraper:main"
webreader-harvest = "dstoolbox.web_reader.harvest:main"
webreader-convert = "dstoolbox.web_reader.convert:main"
webreader-pipeline = "dstoolbox.web_reader.run_pipeline:main"

# Pre/post conversion verdict from an event-level CSV.
dsbayes-group = "dstoolbox.ml_funcs.stat_bayes_group_cli:main"

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
    "docs",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "B",         # flake8-bugbear
    "UP",        # pyupgrade
    "S",         # flake8-bandit (security)
    "PL",        # pylint
    "SIM",       # flake8-simplify
]
ignore = [
    "PLR0913",   # too many arguments
    "PLR2004",   # magic value used in comparison
    "PLR0915",   # too many statements
    "PLR0912",   # too many branches
    "PLR0911",   # too many return statements
    "S101",      # assert used (fine in tests / preconditions)
    "S301",      # pickle usage (needed in some ML flows)
    "S608",      # possible SQL injection (SQL builders are internal)
    "E501",      # line-too-long (formatter handles)
    # Modules append a "public-only extensions (preserved on vendor merge)" block
    # below the main body, so late imports are a deliberate layout convention.
    "E402",
    # Rebinding the loop variable while cleaning a column/line in place is the
    # dominant idiom in the dataframe and text helpers.
    "PLW2901",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S", "PL"]
"dstoolbox/web_reader/**/*.py" = ["S603", "S607"]  # subprocess usage is intentional
"dstoolbox/web_reader/tests/**/*.py" = ["S603", "S607", "SIM115"]  # handles closed via fixtures
"dstoolbox/io_funcs/colab.py" = ["S603", "S607"]   # Colab shells out to git/ssh/kaggle on PATH
"**/__init__.py" = ["F401", "F403"]                # re-exports

[tool.ruff.lint.isort]
known-first-party = ["dstoolbox"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = false
# Start strict on the seam module; expand coverage over time.
files = ["dstoolbox/utils", "dstoolbox/io_funcs/data_sources.py", "dstoolbox/io_funcs/exceptions.py"]

[[tool.mypy.overrides]]
module = "dstoolbox.utils.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: tests that require heavy optional dependencies (e.g. PyMC MCMC sampling)",
]
filterwarnings = [
    "ignore::DeprecationWarning:dstoolbox.utils.logging_utils",
]

[tool.coverage.run]
branch = true
source = ["dstoolbox"]
omit = [
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
