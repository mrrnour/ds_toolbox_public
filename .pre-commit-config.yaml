repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      # Scraped HTML/markdown under web_reader/output is captured verbatim, so
      # rewriting its whitespace would corrupt the fixtures it serves as.
      - id: trailing-whitespace
        exclude: ^dstoolbox/web_reader/output/
      - id: end-of-file-fixer
        exclude: ^dstoolbox/web_reader/output/
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.10
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        additional_dependencies: ["types-PyYAML", "types-requests"]
        files: ^dstoolbox/(utils|io_funcs/(data_sources|exceptions))
